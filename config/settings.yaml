# Trading pairs to monitor
# Selected for: high liquidity, tight spreads, enough volatility to scalp
# More pairs = more opportunities without weakening quality filters
# Each pair gets its own 5-brain evaluation — no shortcuts
pairs:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT
  - XRP/USDT
  - DOGE/USDT
  - BNB/USDT
  - ADA/USDT
  - AVAX/USDT
  - MATIC/USDT
  - LINK/USDT
  - DOT/USDT
  - NEAR/USDT

# Fee structure (Binance with BNB discount)
fees:
  maker_rate: 0.00075  # 0.075% per side
  taker_rate: 0.001    # 0.1% per side (never used — limit only)
  use_bnb_discount: true

# Initial balance for paper trading
initial_balance: 100.0

# Loop interval — how often to scan for trades (seconds)
# Lower = more trades but more API calls
loop_interval_seconds: 30

# Risk management
risk:
  max_open_positions: 4
  max_daily_drawdown_pct: 5.0
  max_consecutive_losses: 5
  consecutive_loss_pause_minutes: 30
  max_daily_trades: 100
  min_balance_floor: 10.0
  max_position_pct: 25.0
  min_order_size: 10.0
  black_swan_pct: 5.0
  stale_data_seconds: 10
  max_spread_pct: 0.15
  time_exit_hours: 1

# Auto-scaling tiers (keyed by minimum balance)
# More pairs = more opportunities, tiers scale positions accordingly
scaling:
  - min_balance: 20
    name: micro
    max_risk_pct: 0.4
    max_positions: 3
    daily_trade_limit: 80
  - min_balance: 100
    name: starter
    max_risk_pct: 0.5
    max_positions: 4
    daily_trade_limit: 100
  - min_balance: 500
    name: growth
    max_risk_pct: 0.75
    max_positions: 6
    daily_trade_limit: 150
  - min_balance: 2000
    name: established
    max_risk_pct: 1.0
    max_positions: 8
    daily_trade_limit: 200

# Protection layers
protection:
  reduce_size_after_losses: 3
  pause_after_losses: 5
  defense_mode_drawdown_pct: 3.0
  weekly_drawdown_reduce_pct: 10.0
  monthly_drawdown_emergency_pct: 15.0
  flash_crash_pct: 5.0
  max_api_errors: 3

# Scheduling
schedule:
  gemini_interval_minutes: 15
  portfolio_snapshot_minutes: 60
  daily_report_hour_utc: 0
