# Trading pairs to monitor
# Selected for: high liquidity, tight spreads, enough volatility to scalp
# More pairs = more opportunities without weakening quality filters
# Each pair gets its own 5-brain evaluation — no shortcuts
pairs:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT
  - XRP/USDT
  - DOGE/USDT
  - BNB/USDT
  - ADA/USDT
  - AVAX/USDT
  - POL/USDT
  - LINK/USDT
  - DOT/USDT
  - NEAR/USDT

# Fee structure (Binance Futures — USDⓈ-M)
# Leveraged positions trade on futures, not spot
fees:
  maker_rate: 0.0002   # 0.02% per side (futures maker)
  taker_rate: 0.0005   # 0.05% per side (futures taker)
  use_bnb_discount: true

# Initial balance for paper trading
initial_balance: 100000.0

# Loop interval — how often to scan for trades (seconds)
# Lower = more trades but more API calls
loop_interval_seconds: 20

# Risk management — PROFIT-FIRST: fewer trades, bigger wins
# Core change: let winners run 3R-5R instead of capping at 0.5R
risk:
  max_open_positions: 8              # leverage means each position locks less cash
  max_daily_drawdown_pct: 3.0
  max_consecutive_losses: 4
  consecutive_loss_pause_minutes: 30
  max_daily_trades: 50               # was 100 — quality over quantity
  min_balance_floor: 10.0
  balance_floor_pct: 70.0
  max_position_pct: 25.0             # cap single position margin to 25% of balance
  risk_per_trade_pct: 1.0
  min_order_size: 10.0
  black_swan_pct: 5.0
  stale_data_seconds: 10
  max_spread_pct: 0.25
  time_exit_hours: 48                 # longer horizon — big wins need time to develop

# Auto-scaling tiers (keyed by minimum balance)
# More pairs = more opportunities, tiers scale positions accordingly
scaling:
  - min_balance: 20
    name: micro
    max_risk_pct: 0.4
    max_positions: 3
    daily_trade_limit: 80
  - min_balance: 100
    name: starter
    max_risk_pct: 0.5
    max_positions: 4
    daily_trade_limit: 100
  - min_balance: 500
    name: growth
    max_risk_pct: 0.75
    max_positions: 6
    daily_trade_limit: 150
  - min_balance: 2000
    name: established
    max_risk_pct: 1.0
    max_positions: 8
    daily_trade_limit: 200
  - min_balance: 50000
    name: professional
    max_risk_pct: 1.5
    max_positions: 8
    daily_trade_limit: 200

# Protection layers — TIGHTENED
protection:
  reduce_size_after_losses: 2        # was 3 — reduce earlier
  pause_after_losses: 4              # was 5 — pause sooner
  defense_mode_drawdown_pct: 1.8     # was 3.0 — 60% of 3% daily limit
  weekly_drawdown_reduce_pct: 7.0    # was 10.0
  monthly_drawdown_emergency_pct: 12.0  # was 15.0
  flash_crash_pct: 5.0
  max_api_errors: 3

# Futures leverage — confidence-scaled leverage tiers
# SL always set BEFORE liquidation price (2% buffer)
# Isolated margin: each position can only lose its own margin
futures:
  enabled: true
  margin_mode: "isolated"
  leverage_tiers:
    low: 1           # <70% confidence — spot-like, barely participate
    medium: 5        # 70%+ confidence — moderate
    high: 15         # 80%+ confidence — multiple brains agree, aggressive
    max: 25          # 90%+ confidence — full consensus, max profit
  liquidation_buffer_pct: 2.0

# Scheduling
schedule:
  gemini_interval_minutes: 15
  portfolio_snapshot_minutes: 60
  daily_report_hour_utc: 0
