# config/strategies.yaml
# Strategy parameters for the 4 evidence-based trading strategies.
# Each strategy has a regime gate (ADX or BB squeeze) that prevents
# trading in the wrong market conditions.
#
# RESEARCH BACKING:
# - Volume Breakout: Sharpe 1.95 (CoinQuant, ETH/USDT)
# - Volatility Squeeze: BB squeeze breakout (John Bollinger)
# - Trend Momentum: 31.96% annual (academic time-series study)
# - Mean Reversion: profit factor 1.62 at ADX < 20 (academic)

# Strategy 1: Volume Breakout (Donchian Channel)
# Catches new trends when price breaks N-period highs/lows
# Only trades in trending markets (ADX > 25)
smart_scalp:
  enabled: true
  adx_min: 25              # regime gate: ADX must be > 25 (strong trend)
  stop_loss_pct: 0.6       # 0.6% (overridden by ATR-based adaptive params)
  take_profit_pct: 1.5     # 1.5% (overridden by ATR-based adaptive params)
  cooldown_candles: 8      # 40 min — trend filter handles quality control
  volume_min: 1.5          # volume must be 1.5x average for confirmation

# Strategy 2: Volatility Squeeze (BB Squeeze Breakout)
# Catches regime transitions when volatility expands after compression
# No ADX gate -- uses BB width compression/expansion instead
grid:
  enabled: true
  squeeze_ratio: 0.85      # BB width must have been 15% below SMA (compressed)
  stop_loss_pct: 0.5       # 0.5% (overridden by ATR-based adaptive params)
  take_profit_pct: 1.5     # 1.5% (overridden by ATR-based adaptive params)
  cooldown_candles: 10     # 50 min — was 18, filters now do quality control
  volume_min: 1.2          # volume must be 1.2x average

# Strategy 3: Trend Momentum (EMA/MACD/ADX)
# Rides established trends with EMA crossover + multiple confirmations
# ADX > 20 = moderate trend (academic research threshold for momentum)
momentum:
  enabled: true
  adx_min: 20              # regime gate: ADX > 20 (momentum research standard)
  stop_loss_pct: 0.5       # 0.5% (overridden by ATR-based adaptive params)
  take_profit_pct: 2.0     # 2.0% (overridden by ATR-based adaptive params)
  cooldown_candles: 6      # 30 min — momentum setups repeat fast in trends

# Strategy 4: Trend Pullback (enters trends during temporary dips/bounces)
# Different from Momentum (which enters on crossover/strength):
# Pullback enters when price temporarily dips INTO the EMA zone
# Trend drift provides the tailwind that overcomes fee drag
mean_reversion:
  enabled: true
  adx_min: 20              # regime gate: ADX > 20 (trend present)
  stop_loss_pct: 0.6       # 0.6% (overridden by ATR-based adaptive params)
  take_profit_pct: 1.5     # 1.5% (overridden by ATR-based adaptive params)
  cooldown_candles: 8      # 40 min — pullbacks happen frequently in trends

# REAL GRID ENGINE — harvests volatility in ranging markets
# Completely different from the 'grid' strategy above (which is BB squeeze breakout).
# This creates a ladder of buy/sell levels between Bollinger Bands and
# profits from EVERY bounce within the range. No prediction needed.
# Auto-activates when regime is RANGING and BB width < max_bb_width_pct.
# Auto-deactivates when price exits range by exit_atr_multiplier × ATR.
real_grid:
  enabled: true
  num_levels: 10             # max levels (actual count is dynamic based on range width)
  max_exposure_pct: 25.0     # max % of balance allocated to grid positions
  max_bb_width_pct: 5.5      # reject grids when BB width > this (too volatile)
  exit_atr_multiplier: 1.0   # close grid when price exits range by N × ATR
  max_concurrent_grids: 3    # cap to prevent over-allocation of balance
  max_grid_loss_pct: 25.0    # force-close grid if unrealized loss > 25% of reserved
