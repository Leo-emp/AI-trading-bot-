smart_scalp:
  enabled: true
  timeframes: ["5m", "15m"]
  rsi_oversold: 30
  rsi_overbought: 70
  volume_spike_multiplier: 1.5
  take_profit_pct: 0.8
  stop_loss_pct: 0.4
  min_net_profit_pct: 0.30
  max_param_drift_pct: 30

grid:
  enabled: true
  levels: 5
  spacing_atr_multiplier: 0.5
  min_spacing_pct: 0.3
  max_spacing_pct: 2.0

momentum:
  enabled: true
  ema_fast: 9
  ema_slow: 21
  rsi_min: 30
  rsi_max: 70
  trailing_stop_pct: 1.5
  trailing_stop_tighten_pct: 0.5

mean_reversion:
  enabled: true
  rsi_extreme_low: 25
  rsi_extreme_high: 75
  bollinger_period: 20
  bollinger_std: 2.0
  pairs_only: ["BTC/USDT", "ETH/USDT"]
